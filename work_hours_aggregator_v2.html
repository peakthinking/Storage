
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1.5rem 0; }
.header { margin-bottom: 1.5rem; }
.header h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.header p { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }

.upload-zone {
  border: 1.5px dashed var(--color-border-secondary);
  border-radius: var(--border-radius-lg);
  padding: 2rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  background: var(--color-background-secondary);
}
.upload-zone:hover { border-color: var(--color-border-primary); background: var(--color-background-primary); }
.upload-zone.dragover { border-color: #1D9E75; background: #E1F5EE; }
.upload-icon { font-size: 32px; margin-bottom: 8px; }
.upload-zone p { font-size: 14px; color: var(--color-text-secondary); }
.upload-zone strong { color: var(--color-text-primary); }
#fileInput { display: none; }

.section { margin-top: 1.5rem; }
.section-title { font-size: 14px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }

.project-row {
  display: flex; gap: 12px; align-items: center;
  padding: 12px 1rem;
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-tertiary);
  border-radius: var(--border-radius-md);
  margin-bottom: 8px;
}
.project-row label { font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.project-row input { flex: 1; max-width: 180px; font-size: 14px; }
.project-row span { font-size: 13px; color: var(--color-text-secondary); }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 1rem; }
.metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 1rem; }
.metric .label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
.metric .value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
.metric .value.success { color: #0F6E56; }
.metric .value.info { color: #185FA5; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; font-weight: 500; font-size: 12px; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); }
td { padding: 8px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
th.num { text-align: right; }
tr.total-row td { font-weight: 500; background: var(--color-background-secondary); }

.charge-input { width: 110px; font-size: 13px; text-align: right; }

.btn-download {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; font-size: 14px;
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  cursor: pointer; color: var(--color-text-primary);
  transition: background 0.15s;
}
.btn-download:hover { background: var(--color-background-secondary); }
.btn-download:active { transform: scale(0.98); }

.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 100px; background: #E1F5EE; color: #0F6E56; font-weight: 500; }
.tag.warn { background: #FAEEDA; color: #854F0B; }
.tag.info { background: #E6F1FB; color: #185FA5; }

.divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin: 1.5rem 0; }
.row-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1rem; }
</style>

<div class="wrap">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden">作業時間集計ツール</h2>
  <div class="header">
    <h2>作業時間集計ツール</h2>
    <p>Excelファイルをアップロードして、職員ごとの月別作業時間とチャージ金額を集計します</p>
  </div>

  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📂</div>
    <p><strong>Excelファイルをドラッグ＆ドロップ</strong></p>
    <p style="margin-top:4px">または クリックして選択（.xlsx / .xls）</p>
    <input type="file" id="fileInput" accept=".xlsx,.xls">
  </div>

  <div id="results" style="display:none">
    <hr class="divider">

    <div class="section">
      <div class="section-title">プロジェクト情報</div>
      <div class="project-row">
        <label>受注金額 (¥)</label>
        <input type="number" id="orderAmount" class="charge-input" style="max-width:200px" placeholder="0" oninput="recalc()">
        <span id="recoveryTag"></span>
      </div>
    </div>

    <div id="metricsRow" class="metrics section"></div>

    <hr class="divider">
    <div class="section">
      <div class="section-title">職員別・月別集計</div>
      <div class="table-wrap">
        <table id="mainTable"></table>
      </div>
    </div>

    <div class="row-actions">
      <button class="btn-download" onclick="downloadExcel()">⬇ Excelダウンロード</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let parsedData = [];
let months = [];
let employees = [];
let chargeRates = {};

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });

function processFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    parsedData = [];
    let startRow = 0;
    if (rows.length > 0) {
      const first = rows[0];
      const isHeader = isNaN(parseFloat(first[3]));
      startRow = isHeader ? 1 : 0;
    }
    for (let i = startRow; i < rows.length; i++) {
      const r = rows[i];
      if (!r[0] && !r[1]) continue;
      let dateVal = r[4];
      let dateObj;
      if (dateVal instanceof Date) { dateObj = dateVal; }
      else if (typeof dateVal === 'number') { dateObj = new Date((dateVal - 25569) * 86400000); }
      else if (typeof dateVal === 'string' && dateVal) {
        dateObj = new Date(dateVal);
        if (isNaN(dateObj)) {
          const m = dateVal.match(/(\d{4})[\/\-](\d{1,2})/);
          dateObj = m ? new Date(m[1], parseInt(m[2]) - 1, 1) : new Date();
        }
      } else { dateObj = new Date(); }
      const yr = dateObj.getFullYear();
      const mo = dateObj.getMonth() + 1;
      const monthKey = `${yr}/${String(mo).padStart(2,'0')}`;
      parsedData.push({
        name: String(r[0] || '').trim(),
        jobCode: String(r[1] || '').trim(),
        jobName: String(r[2] || '').trim(),
        hours: parseFloat(r[3]) || 0,
        month: monthKey
      });
    }
    if (parsedData.length === 0) { alert('データが読み込めませんでした。列構成を確認してください。'); return; }
    employees = [...new Set(parsedData.map(d => d.name))].filter(Boolean).sort();
    months = [...new Set(parsedData.map(d => d.month))].sort();
    chargeRates = {};
    employees.forEach(e => { chargeRates[e] = chargeRates[e] || ''; });
    renderTable();
    document.getElementById('results').style.display = 'block';
    document.getElementById('orderAmount').value = '';
    recalc();
  };
  reader.readAsArrayBuffer(file);
}

function getHours(name, month) {
  return parsedData.filter(d => d.name === name && d.month === month).reduce((s, d) => s + d.hours, 0);
}

function renderTable() {
  const tbl = document.getElementById('mainTable');
  let html = '<thead><tr><th>職員名</th>';
  months.forEach(m => { html += `<th class="num">${m}</th>`; });
  html += '<th class="num">合計時間</th><th class="num">チャージレート(¥/h)</th><th class="num">チャージ合計(¥)</th></tr></thead><tbody>';
  employees.forEach(name => {
    let total = 0;
    html += `<tr><td>${name}</td>`;
    months.forEach(m => {
      const h = getHours(name, m);
      total += h;
      html += `<td class="num">${h > 0 ? h.toLocaleString() : '—'}</td>`;
    });
    const rate = parseFloat(chargeRates[name]) || 0;
    const charge = total * rate;
    html += `<td class="num">${total.toLocaleString()}</td>`;
    html += `<td class="num"><input type="number" class="charge-input" data-name="${name}" value="${chargeRates[name]}" placeholder="例: 15000" oninput="onRateChange(this)"></td>`;
    html += `<td class="num charge-cell" id="charge-${encodeURIComponent(name)}">${rate > 0 ? '¥' + charge.toLocaleString() : '—'}</td>`;
    html += '</tr>';
  });
  const grandTotal = employees.reduce((s, n) => s + months.reduce((ss, m) => ss + getHours(n, m), 0), 0);
  const totalCharge = employees.reduce((s, n) => {
    const total = months.reduce((ss, m) => ss + getHours(n, m), 0);
    return s + total * (parseFloat(chargeRates[n]) || 0);
  }, 0);
  html += `<tr class="total-row"><td>合計</td>`;
  months.forEach(m => {
    const mTotal = employees.reduce((s, n) => s + getHours(n, m), 0);
    html += `<td class="num">${mTotal.toLocaleString()}</td>`;
  });
  html += `<td class="num">${grandTotal.toLocaleString()}</td><td></td><td class="num" id="totalChargeCell">${totalCharge > 0 ? '¥' + Math.round(totalCharge).toLocaleString() : '—'}</td></tr>`;
  html += '</tbody>';
  tbl.innerHTML = html;
}

function onRateChange(input) {
  const name = input.dataset.name;
  chargeRates[name] = input.value;
  recalc();
}

function recalc() {
  if (!parsedData.length) return;
  employees.forEach(name => {
    const total = months.reduce((s, m) => s + getHours(name, m), 0);
    const rate = parseFloat(chargeRates[name]) || 0;
    const charge = total * rate;
    const cell = document.getElementById('charge-' + encodeURIComponent(name));
    if (cell) cell.textContent = rate > 0 ? '¥' + Math.round(charge).toLocaleString() : '—';
  });
  const totalCharge = employees.reduce((s, n) => {
    const total = months.reduce((ss, m) => ss + getHours(n, m), 0);
    return s + total * (parseFloat(chargeRates[n]) || 0);
  }, 0);
  const tcCell = document.getElementById('totalChargeCell');
  if (tcCell) tcCell.textContent = totalCharge > 0 ? '¥' + Math.round(totalCharge).toLocaleString() : '—';
  const grandTotal = employees.reduce((s, n) => s + months.reduce((ss, m) => ss + getHours(n, m), 0), 0);
  const orderAmt = parseFloat(document.getElementById('orderAmount').value) || 0;
  const recovery = (totalCharge > 0 && orderAmt > 0) ? (orderAmt / totalCharge) : null;
  const recTag = document.getElementById('recoveryTag');
  if (recovery !== null) {
    const pct = (recovery * 100).toFixed(1);
    const cls = recovery >= 1 ? 'tag' : recovery >= 0.8 ? 'tag info' : 'tag warn';
    recTag.innerHTML = `<span class="${cls}">回収率 ${pct}%</span>`;
  } else {
    recTag.innerHTML = '';
  }
  const metrics = document.getElementById('metricsRow');
  metrics.innerHTML = `
    <div class="metric"><div class="label">総作業時間</div><div class="value">${grandTotal.toLocaleString()} h</div></div>
    <div class="metric"><div class="label">合計チャージ金額</div><div class="value info">¥${Math.round(totalCharge).toLocaleString()}</div></div>
    <div class="metric"><div class="label">受注金額</div><div class="value">${orderAmt > 0 ? '¥' + Math.round(orderAmt).toLocaleString() : '—'}</div></div>
    <div class="metric"><div class="label">回収率</div><div class="value success">${recovery !== null ? (recovery * 100).toFixed(1) + '%' : '—'}</div></div>
  `;
}

function downloadExcel() {
  const wb = XLSX.utils.book_new();
  const summaryData = [['職員名', ...months, '合計時間', 'チャージレート(¥/h)', 'チャージ合計(¥)']];
  employees.forEach(name => {
    const monthHours = months.map(m => getHours(name, m));
    const total = monthHours.reduce((s, h) => s + h, 0);
    const rate = parseFloat(chargeRates[name]) || 0;
    summaryData.push([name, ...monthHours, total, rate > 0 ? rate : '', rate > 0 ? Math.round(total * rate) : '']);
  });
  const totRow = ['合計'];
  months.forEach(m => totRow.push(employees.reduce((s, n) => s + getHours(n, m), 0)));
  const grandTotal = employees.reduce((s, n) => s + months.reduce((ss, m) => ss + getHours(n, m), 0), 0);
  const totalCharge = employees.reduce((s, n) => {
    const t = months.reduce((ss, m) => ss + getHours(n, m), 0);
    return s + t * (parseFloat(chargeRates[n]) || 0);
  }, 0);
  totRow.push(grandTotal, '', Math.round(totalCharge));
  summaryData.push(totRow);
  const orderAmt = parseFloat(document.getElementById('orderAmount').value) || 0;
  if (orderAmt > 0) {
    summaryData.push([]);
    summaryData.push(['受注金額', orderAmt]);
    summaryData.push(['合計チャージ金額', Math.round(totalCharge)]);
    summaryData.push(['回収率', totalCharge > 0 ? parseFloat(((orderAmt / totalCharge) * 100).toFixed(1)) / 100 : '']);
  }
  const ws = XLSX.utils.aoa_to_sheet(summaryData);
  if (orderAmt > 0) {
    const recRow = summaryData.length;
    const recCell = XLSX.utils.encode_cell({ r: recRow - 1, c: 1 });
    if (ws[recCell]) ws[recCell].z = '0.0%';
  }
  XLSX.utils.book_append_sheet(wb, ws, '職員別集計');
  const rawData = [['職員名', 'ジョブコード', 'ジョブ名', '作業時間', '日付', '月']];
  parsedData.forEach(d => rawData.push([d.name, d.jobCode, d.jobName, d.hours, '', d.month]));
  const ws2 = XLSX.utils.aoa_to_sheet(rawData);
  XLSX.utils.book_append_sheet(wb, ws2, '元データ');
  XLSX.writeFile(wb, '作業時間集計_' + new Date().toISOString().slice(0, 10) + '.xlsx');
}
</script>
