<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>議事メモ生成ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; }

  .header {
    background: linear-gradient(135deg, #1a365d, #2b6cb0);
    color: white;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .header span { font-size: 24px; }

  .container { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 64px); }

  .panel { padding: 24px; overflow-y: auto; }
  .panel-left { background: #fff; border-right: 1px solid #e2e8f0; }
  .panel-right { background: #f7fafc; }

  .panel-title {
    font-size: 13px;
    font-weight: 700;
    color: #4a5568;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid #ebf4ff;
  }

  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  input[type="text"], input[type="date"], textarea, select {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid #e2e8f0;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: #2d3748;
    background: #fff;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #3182ce;
    box-shadow: 0 0 0 3px rgba(49,130,206,0.1);
  }
  textarea { resize: vertical; line-height: 1.6; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #2b6cb0;
    background: #ebf8ff;
    padding: 8px 12px;
    border-radius: 6px;
    margin: 20px 0 12px;
    border-left: 3px solid #3182ce;
  }

  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .item-row input { flex: 1; }
  .item-row .owner { width: 100px; flex-shrink: 0; }
  .item-row .date-input { width: 120px; flex-shrink: 0; }

  .btn-add {
    margin-top: 8px;
    padding: 6px 14px;
    background: #ebf8ff;
    color: #2b6cb0;
    border: 1.5px dashed #90cdf4;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-add:hover { background: #bee3f8; border-color: #3182ce; }

  .btn-remove {
    padding: 6px 10px;
    background: #fff5f5;
    color: #c53030;
    border: 1px solid #fed7d7;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .btn-remove:hover { background: #fed7d7; }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid #e2e8f0;
    flex-wrap: wrap;
  }

  .btn-generate {
    flex: 1;
    padding: 12px 20px;
    background: linear-gradient(135deg, #2b6cb0, #1a365d);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    letter-spacing: 0.5px;
  }
  .btn-generate:hover { opacity: 0.9; }

  .btn-copy {
    padding: 12px 20px;
    background: #e6fffa;
    color: #276749;
    border: 1.5px solid #9ae6b4;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-copy:hover { background: #c6f6d5; }
  .btn-copy.copied { background: #276749; color: white; }

  .btn-download {
    padding: 12px 20px;
    background: #fff;
    color: #4a5568;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-download:hover { background: #f7fafc; border-color: #a0aec0; }

  /* Output area */
  .output-wrapper {
    background: #fff;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    padding: 28px 32px;
    min-height: 400px;
    font-size: 13px;
    line-height: 1.8;
    color: #2d3748;
    white-space: pre-wrap;
    font-family: 'Yu Gothic', 'Segoe UI', sans-serif;
  }

  .output-wrapper h2 {
    font-size: 18px;
    font-weight: 700;
    color: #1a365d;
    text-align: center;
    border-bottom: 2px solid #2b6cb0;
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .output-wrapper .meta-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 16px;
    background: #f7fafc;
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .output-wrapper .meta-key { font-weight: 600; color: #4a5568; }
  .output-wrapper .out-section { margin-bottom: 20px; }
  .output-wrapper .out-section-title {
    font-weight: 700;
    font-size: 13px;
    color: #2b6cb0;
    background: #ebf8ff;
    padding: 6px 12px;
    border-radius: 4px;
    margin-bottom: 10px;
    border-left: 3px solid #3182ce;
  }
  .output-wrapper .out-item {
    padding: 4px 0 4px 16px;
    border-left: 2px solid #e2e8f0;
    margin-bottom: 4px;
  }
  .output-wrapper .out-action {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    padding: 6px 12px;
    background: #fffff0;
    border: 1px solid #fefcbf;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 12px;
    align-items: center;
  }
  .out-action .badge {
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: #ebf8ff;
    color: #2b6cb0;
    white-space: nowrap;
  }
  .out-action .badge-date {
    background: #e6fffa;
    color: #276749;
  }
  .placeholder {
    color: #a0aec0;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }
  .placeholder span { font-size: 36px; display: block; margin-bottom: 12px; }

  .confidential-badge {
    display: inline-block;
    background: #fed7d7;
    color: #c53030;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="header">
  <span>📋</span>
  <h1>議事録メモ生成ツール（李）</h1>
</div>

<div class="container">
  <!-- LEFT: Input Form -->
  <div class="panel panel-left">
    <div class="panel-title">📝 入力</div>

    <!-- Basic Info -->
    <div class="row">
      <div class="form-group">
        <label>会議名・件名</label>
        <input type="text" id="title" placeholder="例：〇〇社 週次定例">
      </div>
      <div class="form-group">
        <label>日時</label>
        <input type="text" id="datetime" placeholder="例：2026/04/09　14:00〜15:00">
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>場所 / 形式</label>
        <input type="text" id="location" placeholder="例：Teams / 会議室A">
      </div>
      <div class="form-group">
        <label>機密レベル</label>
        <select id="confidential">
          <option value="">なし</option>
          <option value="社外秘">社外秘</option>
          <option value="部外秘">部外秘</option>
          <option value="極秘">極秘</option>
        </select>
      </div>
    </div>

    <!-- Attendees -->
    <div class="section-header">👥 出席者</div>
    <div class="row">
      <div class="form-group">
        <label>クライアント側</label>
        <textarea id="client-attendees" rows="2" placeholder="例：山田部長、鈴木課長"></textarea>
      </div>
      <div class="form-group">
        <label>自社側</label>
        <textarea id="our-attendees" rows="2" placeholder="例：李（ファシリ）、田中"></textarea>
      </div>
    </div>

    <!-- Agenda -->
    <div class="section-header">📌 アジェンダ・討議内容</div>
    <div id="agenda-list" class="item-list"></div>
    <button class="btn-add" onclick="addAgenda()">＋ 項目追加</button>

    <!-- Decisions -->
    <div class="section-header">✅ 決定事項</div>
    <div id="decision-list" class="item-list"></div>
    <button class="btn-add" onclick="addDecision()">＋ 追加</button>

    <!-- Action Items -->
    <div class="section-header">⚡ アクションアイテム</div>
    <div style="display:grid; grid-template-columns:1fr 80px 100px; gap:6px; margin-bottom:6px; font-size:11px; font-weight:600; color:#718096; padding:0 4px;">
      <span>内容</span><span>担当者</span><span>期限</span>
    </div>
    <div id="action-list" class="item-list"></div>
    <button class="btn-add" onclick="addAction()">＋ 追加</button>

    <!-- Next Meeting -->
    <div class="section-header">📅 次回</div>
    <div class="row">
      <div class="form-group">
        <label>次回日時</label>
        <input type="text" id="next-date" placeholder="例：2026/04/16　14:00〜">
      </div>
      <div class="form-group">
        <label>次回テーマ</label>
        <input type="text" id="next-theme" placeholder="例：進捗報告・課題確認">
      </div>
    </div>

    <div class="form-group">
      <label>作成者</label>
      <input type="text" id="author" placeholder="例：李">
    </div>

    <div class="actions">
      <button class="btn-generate" onclick="generate()">📋 議事録を生成</button>
      <button class="btn-copy" id="copy-btn" onclick="copyText()">📋 コピー</button>
      <button class="btn-download" onclick="downloadDocx()">💾 保存</button>
    </div>
  </div>

  <!-- RIGHT: Output -->
  <div class="panel panel-right">
    <div class="panel-title">📄 出力プレビュー</div>
    <div id="output">
      <div class="placeholder">
        <span>📋</span>
        左側に入力して「議事メモを生成」を押してください
      </div>
    </div>
  </div>
</div>

<script>
// Initialize with sample rows
window.onload = () => {
  addAgenda(); addAgenda();
  addDecision();
  addAction();
};

function addAgenda() {
  const list = document.getElementById('agenda-list');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <textarea rows="2" placeholder="討議内容・共有事項・結論を記入"></textarea>
    <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}

function addDecision() {
  const list = document.getElementById('decision-list');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <input type="text" placeholder="決定内容">
    <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}

function addAction() {
  const list = document.getElementById('action-list');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <input type="text" placeholder="アクション内容">
    <input type="text" class="owner" placeholder="担当者">
    <input type="text" class="date-input" placeholder="期限（例:4/16）">
    <button class="btn-remove" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}

let generatedText = '';

function generate() {
  const title = document.getElementById('title').value || '（会議名未入力）';
  const datetime = document.getElementById('datetime').value || '―';
  const location = document.getElementById('location').value || '―';
  const confidential = document.getElementById('confidential').value;
  const clientAtt = document.getElementById('client-attendees').value;
  const ourAtt = document.getElementById('our-attendees').value;
  const nextDate = document.getElementById('next-date').value;
  const nextTheme = document.getElementById('next-theme').value;
  const author = document.getElementById('author').value || '―';

  // Agenda
  const agendaItems = [...document.getElementById('agenda-list').querySelectorAll('textarea')]
    .map(t => t.value.trim()).filter(Boolean);
  // Decisions
  const decisions = [...document.getElementById('decision-list').querySelectorAll('input[type=text]')]
    .map(i => i.value.trim()).filter(Boolean);
  // Actions
  const actionRows = [...document.getElementById('action-list').querySelectorAll('.item-row')];
  const actions = actionRows.map(r => {
    const inputs = r.querySelectorAll('input');
    return { task: inputs[0]?.value.trim(), owner: inputs[1]?.value.trim(), due: inputs[2]?.value.trim() };
  }).filter(a => a.task);

  // Build HTML output
  const confBadge = confidential ? `<span class="confidential-badge">${confidential}</span>` : '';

  let html = `
    <h2>${title}${confBadge}</h2>
    <div class="meta-grid">
      <span class="meta-key">日時</span><span>${datetime}</span>
      <span class="meta-key">場所 / 形式</span><span>${location}</span>
      ${clientAtt ? `<span class="meta-key">クライアント</span><span>${clientAtt.replace(/\n/g,', ')}</span>` : ''}
      ${ourAtt ? `<span class="meta-key">自社</span><span>${ourAtt.replace(/\n/g,', ')}</span>` : ''}
      <span class="meta-key">作成者</span><span>${author}</span>
    </div>
  `;

  if (agendaItems.length) {
    html += `<div class="out-section"><div class="out-section-title">📌 討議内容</div>`;
    agendaItems.forEach((item, i) => {
      html += `<div class="out-item"><strong>${i+1}．</strong>${item.replace(/\n/g,'<br>')}</div>`;
    });
    html += `</div>`;
  }

  if (decisions.length) {
    html += `<div class="out-section"><div class="out-section-title">✅ 決定事項</div>`;
    decisions.forEach(d => {
      html += `<div class="out-item">・${d}</div>`;
    });
    html += `</div>`;
  }

  if (actions.length) {
    html += `<div class="out-section"><div class="out-section-title">⚡ アクションアイテム</div>`;
    actions.forEach(a => {
      html += `<div class="out-action">
        <span>${a.task}</span>
        <span class="badge">${a.owner || '未定'}</span>
        <span class="badge badge-date">${a.due || '期限未定'}</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (nextDate || nextTheme) {
    html += `<div class="out-section"><div class="out-section-title">📅 次回</div>
      <div class="out-item">${nextDate ? `日時：${nextDate}` : ''}${nextDate && nextTheme ? '　' : ''}${nextTheme ? `テーマ：${nextTheme}` : ''}</div>
    </div>`;
  }

  document.getElementById('output').innerHTML = `<div class="output-wrapper">${html}</div>`;

  // Build plain text version for copy
  let txt = `【${title}】${confidential ? `【${confidential}】` : ''}\n`;
  txt += `${'─'.repeat(40)}\n`;
  txt += `日時　　：${datetime}\n`;
  txt += `場所　　：${location}\n`;
  if (clientAtt) txt += `クライアント：${clientAtt.replace(/\n/g,'、')}\n`;
  if (ourAtt) txt += `自社　　：${ourAtt.replace(/\n/g,'、')}\n`;
  txt += `作成者　：${author}\n`;
  txt += `${'─'.repeat(40)}\n\n`;

  if (agendaItems.length) {
    txt += `■ 討議内容\n`;
    agendaItems.forEach((item, i) => { txt += `${i+1}. ${item}\n`; });
    txt += `\n`;
  }
  if (decisions.length) {
    txt += `■ 決定事項\n`;
    decisions.forEach(d => { txt += `・${d}\n`; });
    txt += `\n`;
  }
  if (actions.length) {
    txt += `■ アクションアイテム\n`;
    actions.forEach(a => { txt += `・${a.task}【${a.owner||'未定'}】${a.due ? `　期限：${a.due}` : ''}\n`; });
    txt += `\n`;
  }
  if (nextDate || nextTheme) {
    txt += `■ 次回\n`;
    if (nextDate) txt += `日時：${nextDate}\n`;
    if (nextTheme) txt += `テーマ：${nextTheme}\n`;
  }

  generatedText = txt;
}

function copyText() {
  if (!generatedText) { generate(); }
  navigator.clipboard.writeText(generatedText).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✅ コピー完了';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 コピー'; btn.classList.remove('copied'); }, 2000);
  });
}

function xmlEscape(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

function makePara(text, opts = {}) {
  const bold = opts.bold ? '<w:b/><w:bCs/>' : '';
  const size = opts.size || 20; // 10pt default
  const color = opts.color ? `<w:color w:val="${opts.color}"/>` : '';
  const spacing = opts.spacingBefore
    ? `<w:spacing w:before="${opts.spacingBefore}" w:after="${opts.spacingAfter || 60}"/>`
    : '<w:spacing w:after="60"/>';
  const jc = opts.center ? '<w:jc w:val="center"/>' : '';
  const border = opts.borderBottom
    ? `<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="${opts.borderBottom}"/></w:pBdr>`
    : '';
  const lines = Array.isArray(text) ? text : [{ text, bold: opts.bold, size, color: opts.color }];
  const runs = lines.map(r => {
    const rb = r.bold ? '<w:b/><w:bCs/>' : '';
    const rc = r.color ? `<w:color w:val="${r.color}"/>` : '';
    const rs = r.size || size;
    return `<w:r><w:rPr><w:rFonts w:ascii="Meiryo UI" w:hAnsi="Meiryo UI" w:cs="Meiryo UI"/><w:sz w:val="${rs}"/><w:szCs w:val="${rs}"/>${rb}${rc}</w:rPr><w:t xml:space="preserve">${xmlEscape(r.text)}</w:t></w:r>`;
  }).join('');
  return `<w:p><w:pPr>${jc}${border}${spacing}<w:rPr><w:rFonts w:ascii="Meiryo UI" w:hAnsi="Meiryo UI" w:cs="Meiryo UI"/><w:sz w:val="${size}"/><w:szCs w:val="${size}"/>${bold}${color}</w:rPr></w:pPr>${runs}</w:p>`;
}

function downloadDocx() {
  if (!generatedText) { generate(); }

  const titleVal = document.getElementById('title').value || '議事録';
  const datetime = document.getElementById('datetime').value || '―';
  const loc = document.getElementById('location').value || '―';
  const confidential = document.getElementById('confidential').value;
  const clientAtt = document.getElementById('client-attendees').value;
  const ourAtt = document.getElementById('our-attendees').value;
  const nextDate = document.getElementById('next-date').value;
  const nextTheme = document.getElementById('next-theme').value;
  const author = document.getElementById('author').value || '―';

  const agendaItems = [...document.getElementById('agenda-list').querySelectorAll('textarea')]
    .map(t => t.value.trim()).filter(Boolean);
  const decisions = [...document.getElementById('decision-list').querySelectorAll('input[type=text]')]
    .map(i => i.value.trim()).filter(Boolean);
  const actionRows = [...document.getElementById('action-list').querySelectorAll('.item-row')];
  const actions = actionRows.map(r => {
    const inputs = r.querySelectorAll('input');
    return { task: inputs[0]?.value.trim(), owner: inputs[1]?.value.trim(), due: inputs[2]?.value.trim() };
  }).filter(a => a.task);

  const paras = [];

  // Title
  paras.push(makePara(titleVal + (confidential ? `【${confidential}】` : ''), {
    bold: true, size: 28, center: true, spacingBefore: 0, spacingAfter: 160, borderBottom: '2b6cb0'
  }));

  // Meta
  const meta = (label, value) => makePara([{text: label, bold: true}, {text: '　' + value}]);
  paras.push(meta('日時　　：', datetime));
  paras.push(meta('場所　　：', loc));
  if (clientAtt) paras.push(meta('クライアント：', clientAtt.replace(/\n/g, '、')));
  if (ourAtt) paras.push(meta('自社　　：', ourAtt.replace(/\n/g, '、')));
  paras.push(meta('作成者　：', author));

  const sectionHead = (text) => makePara(text, {
    bold: true, color: '1a365d', spacingBefore: 200, spacingAfter: 80, borderBottom: '2b6cb0'
  });

  if (agendaItems.length) {
    paras.push(sectionHead('■ 討議内容'));
    agendaItems.forEach((item, i) => {
      item.split('\n').forEach((line, j) => {
        paras.push(makePara(j === 0 ? `${i + 1}．${line}` : `　　${line}`));
      });
    });
  }

  if (decisions.length) {
    paras.push(sectionHead('■ 決定事項'));
    decisions.forEach(d => paras.push(makePara(`・${d}`)));
  }

  if (actions.length) {
    paras.push(sectionHead('■ アクションアイテム'));
    actions.forEach(a => {
      paras.push(makePara(`・${a.task}【${a.owner || '未定'}】${a.due ? `　期限：${a.due}` : ''}`));
    });
  }

  if (nextDate || nextTheme) {
    paras.push(sectionHead('■ 次回'));
    if (nextDate) paras.push(makePara(`日時：${nextDate}`));
    if (nextTheme) paras.push(makePara(`テーマ：${nextTheme}`));
  }

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas"
  xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<w:body>
${paras.join('\n')}
<w:sectPr>
  <w:pgSz w:w="11906" w:h="16838"/>
  <w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/>
</w:sectPr>
</w:body>
</w:document>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault>
      <w:rPr>
        <w:rFonts w:ascii="Meiryo UI" w:hAnsi="Meiryo UI" w:cs="Meiryo UI"/>
        <w:sz w:val="20"/><w:szCs w:val="20"/>
      </w:rPr>
    </w:rPrDefault>
  </w:docDefaults>
</w:styles>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypes);
  zip.file('_rels/.rels', rootRels);
  zip.file('word/document.xml', documentXml);
  zip.file('word/_rels/document.xml.rels', relsXml);
  zip.file('word/styles.xml', stylesXml);

  zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' })
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${titleVal}_議事録.docx`;
      a.click();
    });
}
</script>
</body>
</html>
